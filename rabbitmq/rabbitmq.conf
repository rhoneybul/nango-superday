# Mounted into the rabbitmq compose service as /etc/rabbitmq/rabbitmq.conf.
# The queue topology itself (exchanges, queues, dead-lettering) is not defined
# here: the API and the consumer both assert it on connect (src/queue/topology.ts).

# Label the Prometheus endpoint (:15692/metrics) per queue, so Grafana can chart
# the depth of `events` and `events.dlq` separately. Off by default because it
# is expensive with thousands of queues; we have two.
prometheus.return_per_object_metrics = true

# Skip the disk/memory watermark alarms tripping on a small dev machine.
disk_free_limit.absolute = 100MB
