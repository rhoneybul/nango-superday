# Scrapes the API's GET /metrics and RabbitMQ's Prometheus plugin (queue depths).
# Grafana's dashboards and alert rules query Prometheus, so the path from
# "a request was rate limited" to "Slack message" never touches Postgres.
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:3000']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
