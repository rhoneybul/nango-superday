services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: nango
      POSTGRES_DB: nango
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango -d nango"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue between the API and the consumer (topology in src/queue/topology.ts). Management UI on :15672
  # (nango/nango). Its Prometheus plugin (:15692, internal) gives Grafana the queue depths; config in ./rabbitmq.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nango
      RABBITMQ_DEFAULT_PASS: nango
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Scrapes the API's /metrics and RabbitMQ's; Grafana's dashboards and alert rules query it.
  # Config: ./prometheus/prometheus.yml. UI on :9090.
  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Alerting (grafana/provisioning/alerting): the Slack contact point posts to #superday-rob
      # with this bot token. Set SLACK_BOT_TOKEN in .env; the placeholder keeps Grafana booting
      # without one (deliveries then fail until it is set).
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-xoxb-REPLACE-WITH-YOURS}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nango:nango@db:5432/nango?schema=public
      RABBITMQ_URL: amqp://nango:nango@rabbitmq:5672
      EVENTS_DEFAULT_LIMIT: 100
      EVENTS_MAX_LIMIT: 1000
      EVENTS_MAX_BUCKETS: 10000
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-100}   # raise for load/throughput.json
      ACCOUNT_CACHE_TTL_SECONDS: 300
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    ports:
      - "${API_PORT:-3000}:3000"
    # Apply migrations, seed the accounts (idempotent), then start the server.
    command: sh -c "npx prisma migrate deploy && node dist/seed.js && node dist/server.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Reads the `events` queue and inserts into Postgres (src/consumer.ts). Same image as the API, different
  # entry point; waits for the API so migrations have been applied. `--scale consumer=N` for more.
  consumer:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nango:nango@db:5432/nango?schema=public
      RABBITMQ_URL: amqp://nango:nango@rabbitmq:5672
      LOG_LEVEL: info
    command: node dist/consumer.js

  # Load generator (k6). Behind a profile, so `docker compose up` does not start it.
  # Run on demand with `npm run load` (uses load/example.json) or
  # `LOAD_CONFIG=my-run.json npm run load` (any file inside ./load). See load/README.md.
  k6:
    image: grafana/k6:2.2.0
    profiles: [load]
    depends_on:
      api:
        condition: service_healthy
    environment:
      TARGET: http://api:3000
    volumes:
      - ./load:/load
    working_dir: /load
    command: run --summary-export=/load/results/summary.json -e CONFIG=/load/${LOAD_CONFIG:-example.json} /load/publish.js

volumes:
  pgdata:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
